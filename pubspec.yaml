name: biciradar
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
    
  
  # Mapas y ubicación
  mapbox_maps_flutter: ^2.20.0
  google_sign_in: ^6.2.1
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  http: ^1.6.0
  image_picker: ^1.1.2
  
  # Caché persistente y conectividad
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

  # Sensores (detección de caídas) y notificaciones locales (alertas push)
  sensors_plus: ^6.1.1
  flutter_local_notifications: ^18.0.1

  # Compartir resumen como imagen (redes sociales)
  share_plus: ^10.1.4
  path_provider: ^2.1.4

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 🔥 ASSETS
  assets:
    - assets/icono_ciclista.png
    - assets/brands/copec.png
    - assets/data/bike_services_scl.json
    - assets/data/ciclovias_scl.json
    - assets/data/ciclorecreovia.json

  # 🔥 FUENTES - POPPINS
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900